name: Build Site Data

# data/*.json（ホームのカード・SST/極端水温/DHW ページ）を Supabase から日次で再生成する。
# sst-daily-updater（JST 14時台に Supabase を更新）の後に走らせる。

on:
  schedule:
    - cron: '13 7 * * *'   # JST 16:13
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build_site_data.py
      - run: python scripts/build_onna_outlook.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update site data [automated]"
          git pull --rebase
          git push
